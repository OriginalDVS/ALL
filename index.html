    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        #praise-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 60;
        }

        .praise-word {
            position: absolute;
            left: 50%;
            white-space: normal;
            text-align: center;
            max-width: 82vw;
            font-weight: 700;
            user-select: none;
            will-change: transform, opacity;
            animation-name: praise-float;
            animation-timing-function: ease-out;
            animation-fill-mode: forwards;
            text-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }

        @keyframes praise-float {
            0% {
                opacity: 0;
                transform: translate(-50%, 0) scale(0.6) rotate(var(--rot, 0deg));
            }
            15% {
                opacity: 1;
                transform: translate(-50%, -8px) scale(1.1) rotate(var(--rot, 0deg));
            }
            60% {
                opacity: 1;
                transform: translate(-50%, -40px) scale(1) rotate(var(--rot, 0deg));
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -90px) scale(0.92) rotate(var(--rot, 0deg));
            }
        }

        #gif-wrapper {
            cursor: pointer;
            transition: transform 0.08s ease;
        }
        #gif-wrapper:active {
            transform: scale(0.96);
        }

        #chosen-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(76,29,149,0.92), rgba(0,0,0,0.92));
            padding: 1.5rem;
        }
        #chosen-modal.show {
            display: flex;
        }
        .modal-card {
            animation: modal-pop 0.5s cubic-bezier(.34,1.56,.64,1) forwards;
        }
        @keyframes modal-pop {
            0% { opacity: 0; transform: scale(0.7) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

    </style>

    <title>Слава Дамиру!</title>

    <!-- Модалка для избранных. Контент (звание 20 или 100 поклонов) подставляется скриптом -->

<script>

        "Дамир, ты вечен как гифка сверху", "Слава! Слава! Слава Дамиру!", "Дамир — наш капитан 🧭",

        "Слава Дамиру и его делам", "Дамир, ты как чашка кофе — незаменим ☕", "Дамир не спит, он охраняет нас",
        "Каждый пиксель этого сайта — во славу Дамира", "Дамир, ты выше всех рейтингов 📈", "Дамир — икона стиля и духа",
        "Дамир, ты вдохновляешь", "Восхваляем Дамира трижды", "Дамир, ты словно первый снег ❄️",
        "Дамир, ты добрее самой доброты", "Дамир — символ надёжности", "Дамир, будь с нами",
        "Дамир, спасибо, что ты есть 🙌", "Дамир, ты — редкий алмаз 💎", "Дамир держит небо на плечах",
        "Дамир, твоя харизма зашкаливает", "Дамир, ты как Wi-Fi — все тебя ищут 📶", "Дамир, ты легенда, не спорь",
        "Дамир, поклон от всего чата", "Дамир, ты редкий вид мудрости", "Дамир, ты душа команды",
        "Дамир, продолжай в том же духе", "Слава тебе, о Дамир, во все дни", "Дамир, ты бесконечен как этот список",
        "Дамир, ты как хороший баг — все обсуждают 🐞", "Дамир, ты вершина карьерной лестницы", "Дамир, ты редкость",
        "Дамир, respect 🫡", "Дамир, ты топ 1% людей", "Дамир, склоняем голову",
        "Дамир, ты словно последний глоток чая 🍵", "Дамир, легенда не умирает", "Дамир, ты входишь в историю",
        "Дамир, ты причина, по которой мы тут", "Слава Дамиру! И точка."
    ];

    const fontFamilies = [
        "'Pacifico', cursive",
        "'Caveat', cursive",
        "'Bebas Neue', sans-serif",
        "'Press Start 2P', monospace",
        "'Marck Script', cursive",
        "'Rubik Mono One', sans-serif",
        "'Comfortaa', sans-serif",
        "'Permanent Marker', cursive",
        "'Ceviche One', cursive",
        "'Inter', sans-serif"
    ];

    const colors = [
        "#e11d48", "#7c3aed", "#2563eb", "#059669", "#d97706",
        "#db2777", "#ca8a04", "#0891b2", "#9333ea", "#dc2626",
        "#16a34a", "#4f46e5", "#ea580c", "#0d9488", "#c026d3"
    ];

    const sparkleEmojis = ["✨", "👑", "🙌", "🔥", "🙏", "😂", "💎", "🎉", "🕊️", "⭐"];

    let clickCount = 0;
    let hasCelebratedTier1 = false;
    let hasCelebratedTier2 = false;
    const REQUIRED_CLICKS_TIER1 = 20;
    const REQUIRED_CLICKS_TIER2 = 100;

    const tier1Html = `
        <div class="text-6xl mb-4">👑✨🙌</div>
        <h2 class="text-3xl font-black mb-3 bg-gradient-to-r from-purple-600 via-pink-500 to-yellow-500 bg-clip-text text-transparent">

        </h2>
        <p class="text-gray-700 text-lg leading-relaxed mb-4">
            Ты 20 раз склонился перед Дамиром — и это не осталось незамеченным.
            Твоё усердие, твоя вера, твой указательный палец — всё пошло не зря.
        </p>
        <p class="text-gray-700 text-lg leading-relaxed mb-6">
            Отныне ты — <span class="font-bold text-purple-700">Верный Поклонник Дамира</span> 🕊️,
            и тебе полагается невидимая корона, вечное уважение чата
            и лёгкое чувство гордости за проделанную работу.
        </p>
        <p class="text-sm text-gray-400 mb-6">Слава Дамиру. Всегда. Во веки веков. 👑</p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="zal-damira.html" class="bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-700 hover:to-pink-600 text-white font-bold py-3 px-6 rounded-xl transition-colors text-center">
                Войти в Зал Дамира →
            </a>
            <button id="close-modal" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl transition-colors">
                Пока не готов
            </button>
        </div>
    `;

    const tier2Html = `
        <div class="text-6xl mb-4">🏆👑🔥</div>
        <h2 class="text-3xl font-black mb-3 bg-gradient-to-r from-yellow-400 via-orange-500 to-red-600 bg-clip-text text-transparent">
            Внутренний Круг Дамира
        </h2>
        <p class="text-gray-700 text-lg leading-relaxed mb-4">
            100 поклонов. Сто. Обычные люди сдаются на десятом,
            а ты продолжал — с упорством, достойным легенд.
        </p>
        <p class="text-gray-700 text-lg leading-relaxed mb-4">
            Отныне твой титул — <span class="font-bold text-orange-600">Архижрец Культа Дамира</span> 🔱.
            Ты вошёл в Внутренний Круг — туда, куда пускают немногих.
        </p>
        <div class="bg-gradient-to-r from-yellow-50 to-orange-50 border-2 border-dashed border-orange-300 rounded-2xl p-4 mb-6">
            <p class="text-sm text-orange-500 font-semibold mb-1">🎁 СЕКРЕТНЫЙ ПРИЗ</p>
            <p class="text-gray-700 font-medium">
                Пожизненное право первым здороваться с Дамиром,
                виртуальный орден «За стойкость пальца» и наше искреннее восхищение
                тем, сколько времени ты на это потратил.
            </p>
        </div>
        <p class="text-sm text-gray-400 mb-6">Дамир заметил тебя. Дамир доволен. 🔱</p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="zal-damira.html" class="bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 text-white font-bold py-3 px-6 rounded-xl transition-colors text-center">
                Войти в Зал Дамира →
            </a>
            <button id="close-modal" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl transition-colors">
                Пока не готов
            </button>
        </div>
    `;

    const praiseLayer = document.getElementById('praise-layer');
    const gifWrapper = document.getElementById('gif-wrapper');
    const modal = document.getElementById('chosen-modal');
    const modalCard = modal.querySelector('.modal-card');

    function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
    }

    function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function spawnPraise() {
        // Убираем предыдущую фразу, если она ещё видна — на экране всегда не больше одной
        const existing = praiseLayer.querySelector('.praise-word');
        if (existing) existing.remove();

        const word = document.createElement('div');
        word.className = 'praise-word';

        let text = pick(praisePhrases);
        if (Math.random() < 0.35) {
            text += ' ' + pick(sparkleEmojis);
        }
        word.textContent = text;

        const font = pick(fontFamilies);
        const color = pick(colors);
        const size = randomBetween(16, 28);
        const rot = randomBetween(-10, 10);
        const duration = randomBetween(3, 5);

        word.style.fontFamily = font;
        word.style.color = color;
        word.style.fontSize = size + 'px';
        word.style.setProperty('--rot', rot + 'deg');
        word.style.animationDuration = duration + 's';

        // Появляется по центру экрана (чуть выше середины), небольшой вертикальный разброс
        const topPercent = randomBetween(38, 46);
        word.style.top = topPercent + '%';

        praiseLayer.appendChild(word);
        setTimeout(() => { if (word.parentNode) word.remove(); }, duration * 1000 + 100);
    }

    function showModal(html) {
        modalCard.innerHTML = html;
        modal.classList.add('show');
        modal.querySelector('#close-modal').addEventListener('click', () => {
            modal.classList.remove('show');
        });
    }

    gifWrapper.addEventListener('click', () => {
        spawnPraise();
        clickCount++;

        if (clickCount >= REQUIRED_CLICKS_TIER2 && !hasCelebratedTier2) {
            hasCelebratedTier2 = true;
            setTimeout(() => showModal(tier2Html), 400);
        } else if (clickCount >= REQUIRED_CLICKS_TIER1 && !hasCelebratedTier1) {
            hasCelebratedTier1 = true;
            setTimeout(() => showModal(tier1Html), 400);
        }
    });
</script>
